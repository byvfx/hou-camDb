name: lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff==0.17.6

      - name: Lint
        # Static check only. Houdini's hou module is not available in CI,
        # so this job must not import or execute the script.
        # E9, F63, F7, and F82 cover syntax and undefined-name errors.
        # Broader style rules are left off so the existing script stays unchanged.
        run: ruff check --select E9,F63,F7,F82 .
